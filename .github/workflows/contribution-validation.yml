name: Contribution validation
on:
  push:
    branches: [contribution-validation]
  workflow_dispatch:
    inputs:
      patch:
        description: Base64 gzip patch against upstream main
        required: true
      name:
        description: Validation label
        required: true
      runtime:
        description: Attempt Apple Container smoke tests
        type: boolean
        default: false
run-name: Validate ${{ inputs.name }}
permissions:
  contents: read
jobs:
  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: socktainer/socktainer
          ref: 8f9a916271ebf575218ab1b6ed4d08522ebc15f2
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build
          key: ${{ runner.os }}-contribution-spm-${{ hashFiles('**/Package.resolved') }}
      - name: Apply proposed changes
        env:
          PROPOSED_PATCH: ${{ inputs.patch }}
        run: |
          python3 - <<'PY'
          import os, base64, gzip, subprocess
          subprocess.run(['git', 'apply'], input=gzip.decompress(base64.b64decode(os.environ['PROPOSED_PATCH'])), check=True)
          PY
      - name: Format
        run: make fmt
      - name: Save formatted patch
        if: always()
        run: |
          git add -N Sources Tests scripts
          git diff --binary > formatted.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: formatted-patch
          path: formatted.patch
      - name: Unit tests
        run: make test
      - name: Release build
        run: make release
      - name: Install Apple Container for runtime smoke tests
        if: inputs.runtime
        run: |
          VERSION=$(python3 -c "import json; print(next(p['state']['version'] for p in json.load(open('Package.resolved'))['pins'] if p['identity']=='container'))")
          curl -fsSL "https://github.com/apple/container/releases/download/$VERSION/container-installer-unsigned.pkg" -o /tmp/container.pkg
          sudo installer -pkg /tmp/container.pkg -target /
          brew install docker
      - name: Start Apple Container
        if: inputs.runtime
        run: |
          if ! sudo container system start --enable-kernel-install; then
            PLIST="$(sudo find /var/root "$HOME" -maxdepth 6 -path '*/com.apple.container/apiserver/apiserver.plist' 2>/dev/null | head -1)"
            test -n "$PLIST"
            sudo launchctl bootstrap system "$PLIST"
            sudo container system start --enable-kernel-install
          fi
          sudo container system status
      - name: Exercise Docker metadata regressions
        if: inputs.runtime
        run: |
          nohup sudo -i "$PWD/.build/release/socktainer" > service.log 2>&1 &
          python3 - <<'PYTEST'
          import subprocess, time, json, pathlib
          def docker(*args, timeout=120, check=True):
              result = subprocess.run(['sudo', 'docker', '--host', 'unix:///var/root/.socktainer/container.sock', *args], text=True, capture_output=True, timeout=timeout)
              print('docker', *args, flush=True)
              print(result.stdout, result.stderr, flush=True)
              if check and result.returncode:
                  raise RuntimeError(f'docker failed: {result.returncode}')
              return result
          for _ in range(30):
              if docker('version', check=False, timeout=15).returncode == 0:
                  break
              time.sleep(1)
          else:
              raise RuntimeError('socktainer did not become ready')
          docker('pull', 'alpine:3.22')
          for name in ['aa-one', 'aa-two', 'xx-other']:
              docker('create', '--name', name, 'alpine:3.22', 'true')
          assert docker('ps', '-a', '--filter', 'name=^/?(k3d-)?aa-one$', '--format', '{{.Names}}').stdout.strip() == 'aa-one'
          assert set(docker('ps', '-a', '--filter', 'name=aa', '--format', '{{.Names}}').stdout.split()) == {'aa-one', 'aa-two'}
          image = 'rancher/k3s:v1.35.5-k3s1'
          docker('pull', image, timeout=600)
          expected = {'/var/lib/cni', '/var/lib/kubelet', '/var/lib/rancher/k3s', '/var/log'}
          assert set(json.loads(docker('image', 'inspect', image, '--format', '{{json .Config.Volumes}}').stdout)) == expected
          docker('create', '--name', 'volume-test', '--entrypoint', '/bin/sh', image, '-c', 'test -d /var/log')
          mounts = json.loads(docker('inspect', 'volume-test', '--format', '{{json .Mounts}}').stdout)
          assert {m['Destination'] for m in mounts if m['Type']=='volume'} == expected
          names = [m['Name'] for m in mounts if m['Type']=='volume']
          docker('rm', '-v', 'volume-test')
          for name in names:
              assert docker('volume', 'inspect', name, check=False).returncode != 0
          docker('volume', 'create', 'keep-named')
          docker('create', '--name', 'override-test', '-v', 'keep-named:/var/log', '--entrypoint', '/bin/sh', image, '-c', 'true')
          mounts = json.loads(docker('inspect', 'override-test', '--format', '{{json .Mounts}}').stdout)
          assert len([m for m in mounts if m['Destination']=='/var/log']) == 1
          assert next(m['Name'] for m in mounts if m['Destination']=='/var/log') == 'keep-named'
          docker('rm', '-v', 'override-test')
          docker('volume', 'inspect', 'keep-named')
          docker('create', '--name', 'retain-test', '--entrypoint', '/bin/sh', image, '-c', 'true')
          mounts = json.loads(docker('inspect', 'retain-test', '--format', '{{json .Mounts}}').stdout)
          names = [m['Name'] for m in mounts if m['Type']=='volume']
          docker('rm', 'retain-test')
          for name in names:
              docker('volume', 'inspect', name)
              docker('volume', 'rm', name)
          print('Metadata regressions passed. Guest boot was not attempted: the earlier macOS hosted-runner attempt reported virtualization unavailable.', flush=True)
          PYTEST
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.runtime
        with:
          name: runtime-logs
          path: service.log
